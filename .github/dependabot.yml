version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/ImageViewer
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    ignore:
      # 3.x+ requires a separate ImageSharp commercial-licensing decision.
      - dependency-name: SixLabors.ImageSharp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
